<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Pro Clubs İstatistikleri</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="top">
    <div class="wrap">
      <div class="brand">
        <h1>Pro Clubs İstatistikleri</h1>
        <span id="updated" class="muted"></span>
      </div>
      <div class="filters">
        <div class="seg" id="clubFilter"></div>
        <select id="typeFilter" aria-label="Maç türü">
          <option value="all">Tüm maçlar</option>
          <option value="leagueMatch">Lig</option>
          <option value="playoffMatch">Playoff</option>
          <option value="friendlyMatch">Hazırlık</option>
        </select>
      </div>
      <nav class="tabs" id="tabs">
        <button data-tab="ozet" class="active">Özet</button>
        <button data-tab="maclar">Maçlar</button>
        <button data-tab="oyuncular">Oyuncular</button>
        <button data-tab="sezon">EA Sezon Toplamı</button>
      </nav>
    </div>
  </header>

  <main class="wrap">
    <section id="ozet" class="tab active"></section>
    <section id="maclar" class="tab"></section>
    <section id="oyuncular" class="tab"></section>
    <section id="sezon" class="tab"></section>
  </main>

  <footer class="wrap muted small">
    Veriler EA'nın herkese açık Pro Clubs servisinden otomatik toplanır. Takip başladıktan sonraki maçlar kaydedilir.
  </footer>
  <script src="app.js"></script>
</body>
</html>
